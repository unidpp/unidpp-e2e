name: Test
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # nightly at 03:17 UTC — the pilot's nightly-backup minute; the
    # drift leg (and now the public truth surfaces) catch ambient rot
    # without a push to trigger them
    - cron: "17 3 * * *"

jobs:
  demo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: unidpp-e2e
    steps:
      # The demo drives the sibling services; check them out side by
      # side, mirroring the family layout the orchestrator assumes.
      - uses: actions/checkout@v4
        with:
          path: unidpp-e2e
      - uses: actions/checkout@v4
        with:
          repository: unidpp/unidpp-core
          path: unidpp-core
      - uses: actions/checkout@v4
        with:
          repository: unidpp/unidpp-signatif
          path: unidpp-signatif
      - uses: actions/checkout@v4
        with:
          repository: unidpp/unidpp-cli
          path: unidpp-cli
      - uses: actions/checkout@v4
        with:
          repository: unidpp/unidpp-py
          path: unidpp-py
      - uses: actions/checkout@v4
        with:
          repository: unidpp/unidpp-registry
          path: unidpp-registry
      - uses: actions/checkout@v4
        with:
          repository: unidpp/unidpp-issuer
          path: unidpp-issuer
      - uses: actions/checkout@v4
        with:
          repository: unidpp/unidpp-trust
          path: unidpp-trust
      - uses: actions/checkout@v4
        with:
          repository: unidpp/unidpp-log
          path: unidpp-log
      - uses: actions/checkout@v4
        with:
          repository: unidpp/unidpp-gateway
          path: unidpp-gateway
      - uses: actions/checkout@v4
        with:
          repository: unidpp/unidpp-hub
          path: unidpp-hub
      # The resolver (make deps builds it; the demo's G-CORR beats
      # need its current binary) and the drift leg's subjects: the
      # checks in harness test 13 skip loudly without their checkouts,
      # and the env contract needs every service's openapi.yaml.
      - uses: actions/checkout@v4
        with:
          repository: unidpp/unidpp-resolver
          path: unidpp-resolver
      - uses: actions/checkout@v4
        with:
          repository: unidpp/unidpp-config
          path: unidpp-config
      - uses: actions/checkout@v4
        with:
          repository: unidpp/unidpp-projector
          path: unidpp-projector
      - uses: actions/checkout@v4
        with:
          repository: unidpp/unidpp-archive
          path: unidpp-archive
      - uses: actions/checkout@v4
        with:
          repository: unidpp/unidpp-console
          path: unidpp-console
      - uses: actions/checkout@v4
        with:
          repository: unidpp/unidpp-docs
          path: unidpp-docs
      - uses: actions/checkout@v4
        with:
          repository: unidpp/unidpp.github.io
          path: unidpp.github.io
      - uses: actions/checkout@v4
        with:
          repository: unidpp/unidpp-ts
          path: unidpp-ts
      - uses: actions/checkout@v4
        with:
          repository: unidpp/unidpp-rb
          path: unidpp-rb
      - uses: actions/checkout@v4
        with:
          repository: unidpp/unidpp-spec
          path: unidpp-spec
      - uses: actions/checkout@v4
        with:
          repository: unidpp/unidpp-papers
          path: unidpp-papers
      # No toolchain step: rustup resolves rust-toolchain.toml at
      # every cargo invocation, so CI installs and formats with the
      # exact pinned generation (the file is the single source).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the docs' and the site's Node dependencies
        run: |
          (cd ../unidpp-docs && npm ci)
          (cd ../unidpp.github.io && npm ci)
      - name: Build the family's dependencies (every service binary — no test skips for a missing binary)
        run: make deps-live
      - name: Run the story (B1-B10, B-CTO, B-INT)
        run: make demo
      - name: The family harness (the twelve legs + the drift leg)
        run: make test
